<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>生きものカードをさがす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef6fa;
    --card: #ffffff;
    --ink: #1d2b36;
    --muted: #5d6f7c;
    --accent: #1f7fb8;
    --line: #cfdde6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    font-weight: 500;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; font-weight: 700; margin: 4px 0 12px; text-align: center; }
  input {
    font: inherit; font-size: 17px; padding: 12px; width: 100%; min-height: 48px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .results { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .results a {
    display: grid; gap: 2px; padding: 14px 16px; border-radius: 12px; background: var(--card);
    border: 1.5px solid var(--line); color: var(--ink); text-decoration: none;
  }
  .results a:active { border-color: var(--accent); }
  .r-name { font-weight: 700; font-size: 17px; }
  .r-sci { font-family: "Helvetica Neue", Arial, sans-serif; font-style: italic; color: var(--muted); font-size: 14px; }
  .r-sci:empty { display: none; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <h1>生きものカードをさがす</h1>
  <form role="search" onsubmit="event.preventDefault(); document.activeElement.blur();">
    <input type="search" id="q" placeholder="なまえで さがす（例：カサゴ）" enterkeyhint="search" autocomplete="off" aria-label="生きものの名前">
  </form>
  <ul class="results" id="results"></ul>
  <p class="hint" id="empty" hidden></p>
</main>
<script>
(async () => {
  const input = document.getElementById('q');
  const list = document.getElementById('results');
  const empty = document.getElementById('empty');

  // ひらがな→カタカナ、全角英数→半角、大文字→小文字にそろえて比べる
  const normalize = (t) => (t || '').normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60))
    .replace(/\s+/g, '');

  let cards = [];
  try {
    const r = await fetch(`n/index.json?t=${Date.now()}`, { cache: 'no-store' });
    if (r.ok) cards = (await r.json()).slice().reverse();   // 新しい順
  } catch (e) {}

  const render = () => {
    const q = normalize(input.value);
    const hits = cards.filter(c => !q || normalize(c.name).includes(q) || normalize(c.sci).includes(q));
    list.replaceChildren(...hits.map(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `index.html?n=${encodeURIComponent(c.id)}`;
      const name = document.createElement('span');
      name.className = 'r-name'; name.textContent = c.name;
      const sci = document.createElement('span');
      sci.className = 'r-sci'; sci.textContent = c.sci || '';
      a.append(name, sci);
      li.append(a);
      return li;
    }));
    empty.hidden = hits.length > 0;
    empty.textContent = cards.length ? '見つかりませんでした。ちがうことばで さがしてみてね' : 'まだ さがせるカードはありません';
  };
  input.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
