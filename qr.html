<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード一覧</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --ink: #1d2b36; --muted: #5d6f7c; --line: #cfdde6; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .controls { display: grid; gap: 8px; margin-bottom: 16px; }
  .controls input { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; box-sizing: border-box; }
  .controls p { margin: 0; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .item { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; break-inside: avoid; }
  .item svg { width: 100%; height: auto; display: block; }
  .item b { display: block; margin-top: 6px; font-size: 14px; }
  .item a { font-size: 11px; color: var(--muted); word-break: break-all; }
  @media print {
    .controls { display: none; }
    main { padding: 0; }
    .grid { grid-template-columns: repeat(4, 1fr); }
    .item a { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="controls">
    <h1>QRコード一覧</h1>
    <label>カードページのURL（公開先）
      <input id="base" type="url">
    </label>
    <p>公開したURLでこのページを開けば自動で入ります。印刷すると4列で並びます。</p>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
  const baseInput = document.getElementById('base');
  baseInput.value = new URL('index.html', location.href).href;
  let cards = [];

  function render() {
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const c of cards) {
      const url = `${baseInput.value}?c=${c.id}`;
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      const b = document.createElement('b');
      b.textContent = `${c.no}. ${c.name}`;
      const a = document.createElement('a');
      a.href = url; a.textContent = url; a.target = '_blank';
      div.append(b, a);
      grid.append(div);
    }
  }

  fetch('master.json').then(r => r.json()).then(list => { cards = list; render(); });
  baseInput.addEventListener('input', render);
</script>
</body>
</html>
