<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生きものカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef6fa;
    --card: #ffffff;
    --ink: #1d2b36;
    --muted: #5d6f7c;
    --accent: #1f7fb8;
    --accent-ink: #ffffff;
    --line: #cfdde6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    font-weight: 500;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; font-weight: 700; margin: 4px 0 12px; text-align: center; }
  .preview {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    overflow: hidden;
    line-height: 0;
  }
  .preview canvas, .preview img { width: 100%; height: auto; display: block; }
  form { margin-top: 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
  input {
    font: inherit;
    font-size: 17px; /* 16px以上でiOSの自動ズームを防ぐ */
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
    min-height: 48px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 18px;
    border: 0;
    border-radius: 999px;
    padding: 14px;
    min-height: 52px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
  .result { margin-top: 20px; display: none; }
  .result.show { display: block; }
  .result p { text-align: center; font-weight: 700; margin: 0 0 8px; }
  .result a { display: block; text-align: center; margin-top: 10px; color: var(--accent); }
  .message { text-align: center; padding: 48px 8px; line-height: 1.8; }
  .privacy {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
  .privacy p { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
</style>
</head>
<body>
<main id="app">
  <div class="message" id="loading">よみこみ中…</div>
</main>
<footer class="privacy">
  <p>🔒 入力した「見つけた日」と「名前」は、お使いのスマートフォンの中だけで画像にしています。サーバーへ送信したり、このサイトに保存したりすることはありません。</p>
</footer>

<template id="card-view">
  <h1 id="title"></h1>
  <div class="preview"><canvas id="canvas"></canvas></div>
  <form id="form" autocomplete="off">
    <label>見つけた日
      <input type="date" id="date" required>
    </label>
    <label>見つけた人（あなたの名前）
      <input type="text" id="finder" maxlength="20" placeholder="なまえを入れてね" enterkeyhint="done">
    </label>
    <button type="submit" id="save">画像を保存する</button>
    <p class="hint">保存した画像は写真アプリ（ギャラリー）に入ります</p>
  </form>
  <div class="result" id="result">
    <p>↓ 画像を長押しして「写真に保存」もできます</p>
    <div class="preview"><img id="result-img" alt="完成したカード"></div>
    <a id="download" download>画像をダウンロード</a>
  </div>
</template>


<script>
(() => {
  const SCALE = 2;              // 出力解像度（元画像 945×591 の2倍）
  const FONT = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif';
  const FONT_WEIGHT = 700;
  const FONT_SIZE = 30;         // 元画像座標でのサイズ
  const app = document.getElementById('app');

  // ?c= … 最初からある21枚（c フォルダ）、?n= … 管理ページで追加したカード（n フォルダ）
  const params = new URLSearchParams(location.search);
  const dir = params.has('n') ? 'n' : 'c';
  const id = params.get(dir);
  if (!id) return showMessage('QRコードを読みこんで<br>カードを表示してね');
  if (!/^[a-z0-9]{4,16}$/.test(id)) return showMessage('カードが見つかりませんでした。<br>もう一度QRコードを読みこんでね');

  fetch(`${dir}/${id}.json`)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(start)
    .catch(() => showMessage('カードが見つかりませんでした。<br>もう一度QRコードを読みこんでね'));

  function showMessage(html) {
    app.innerHTML = `<div class="message">${html}</div>`;
  }


  function loadImage(src) {
    return new Promise((ok, ng) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = ng;
      img.src = src;
    });
  }

  async function start(card) {
    const base = await loadImage(`${dir}/${card.image}`);
    app.replaceChildren(document.getElementById('card-view').content.cloneNode(true));
    const label = card.name || card.sci || '生きものカード';   // 和名なしのカードもある
    document.title = label === '生きものカード' ? label : label + '｜生きものカード';
    document.getElementById('title').textContent = label;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    // 元の21枚は 945×591、管理ページで追加したカードは高解像度なので、座標系(card.w/h)に合わせる
    canvas.width = (card.w || base.naturalWidth) * SCALE;
    canvas.height = (card.h || base.naturalHeight) * SCALE;

    const dateInput = document.getElementById('date');
    const finderInput = document.getElementById('finder');
    dateInput.value = todayISO();

    const draw = () => {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(base, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
      writeOnLine(ctx, formatDate(dateInput.value), card.date);
      writeOnLine(ctx, finderInput.value.trim(), card.finder);
    };

    // フォント読み込み後に描き直す（入力された文字のグリフも都度読み込む）
    const redraw = async () => {
      const text = formatDate(dateInput.value) + finderInput.value;
      try { await document.fonts.load(`${FONT_WEIGHT} ${FONT_SIZE}px "Zen Maru Gothic"`, text || 'あ'); } catch (e) {}
      draw();
    };
    draw();
    redraw();
    dateInput.addEventListener('input', redraw);
    finderInput.addEventListener('input', redraw);

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      finderInput.blur();
      if (!finderInput.value.trim()) { finderInput.focus(); finderInput.placeholder = 'なまえを入れてね！'; return; }
      const btn = document.getElementById('save');
      btn.disabled = true;
      try {
        await redraw();
        const blob = await new Promise(ok => canvas.toBlob(ok, 'image/png'));
        const filename = `${card.name || card.sci || '生きものカード'}_${dateInput.value || 'card'}.png`;
        showResult(blob, filename);
        await share(blob, filename, card.name);
      } finally {
        btn.disabled = false;
      }
    });
  }

  // 下線の上に文字を書く。長い場合は縮める
  function writeOnLine(ctx, text, line) {
    if (!text) return;
    const pad = 10;
    const maxW = line.x1 - line.x0 - pad * 2;
    let size = FONT_SIZE;
    ctx.font = `${FONT_WEIGHT} ${size}px ${FONT}`;
    while (ctx.measureText(text).width > maxW && size > 12) {
      size -= 1;
      ctx.font = `${FONT_WEIGHT} ${size}px ${FONT}`;
    }
    ctx.fillStyle = '#1a1a1a';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillText(text, line.x0 + pad, line.y - 7);
  }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${+m[1]}年${+m[2]}月${+m[3]}日` : '';
  }

  let lastUrl;
  function showResult(blob, filename) {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    document.getElementById('result-img').src = lastUrl;
    const a = document.getElementById('download');
    a.href = lastUrl;
    a.download = filename;
    document.getElementById('result').classList.add('show');
  }

  // スマホでは共有シート（「画像を保存」）を開く。使えなければ画像の長押し/ダウンロードで保存
  async function share(blob, filename, title) {
    const file = new File([blob], filename, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>
</body>
</html>
